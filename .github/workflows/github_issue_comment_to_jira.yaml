name: Push GitHub Issue Comment to Jira

on:
  issue_comment:
    types: [created, edited]

jobs:
  push-comment-to-jira:
    runs-on: ubuntu-latest

    # Only run on issue comments (not PR Comments)
    if: ${{ !github.event.issue.pull_request }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Publish comment to Jira if intended
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_PROJECT_NAME: "Jira-GitHub-Tracker"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          JIRA_LABEL: "jira-issue"
          JIRA_EMAIL: "techkoala6@gmail.com"
          JIRA_DOMAIN: "dev-tech-koala.atlassian.net"
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python push_github_issue_comment_to_jira.py
