name: Push GitHub Issue Comment to Jira

on:
  issue_comment:
    types: [created, edited]

jobs:
  push-comment-to-jira:
    runs-on: ubuntu-latest

    # Only run on issue comments (not PR Comments)
    if: ${{ !github.event.issue.pull_request }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Publish comment to Jira if intended
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
            echo "Checking if comment is intended for Jira..."
            echo "Comment Body: $COMMENT_BODY"
            echo "Comment Author: $COMMENT_AUTHOR"
            echo "Issue Number: $ISSUE_NUMBER"
            echo "Issue Title: $ISSUE_TITLE"
            echo "Repository Owner: $REPO_OWNER"
            echo "Repository Name: $REPO_NAME"
